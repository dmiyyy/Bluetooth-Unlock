[VERSION]
version = 10.0

[SETTINGS]
# seconds between checks
check_interval = 3
# consecutive failed checks before the session is locked
fail_threshold = 3
# seconds l2ping waits for an answer
ping_timeout = 2
# unlock automatically when the device comes back (yes/no)
unlock_on_return = yes
# l2ping | bluetoothctl | both
detection = l2ping
